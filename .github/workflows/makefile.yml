name: Build U-Boot

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            device-tree-compiler \
            lzop

      - name: Install Linaro 6.3.1 toolchain
        run: |
          git clone \
            --depth 1 \
            --branch develop-11.0 \
            https://github.com/rockchip-toybrick/gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu.git \
            /opt/toolchains/linaro-6.3.1

      - name: Verify toolchain
        run: |
          /opt/toolchains/linaro-6.3.1/bin/aarch64-linux-gnu-gcc --version
          /opt/toolchains/linaro-6.3.1/bin/aarch64-linux-gnu-gcc -dumpversion

      - name: Build U-Boot
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=/opt/toolchains/linaro-6.3.1/bin/aarch64-linux-gnu-

          ./make.sh odroidgoa

      - name: Verify build outputs
        run: |
          echo "Build output:"
          ls -lh sd_fuse/

          test -f sd_fuse/idbloader.img
          test -f sd_fuse/uboot.img
          test -f sd_fuse/trust.img

      - name: Upload U-Boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rg351mp-uboot
          path: |
            sd_fuse/idbloader.img
            sd_fuse/uboot.img
            sd_fuse/trust.img
